<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Untrackable</title>
    <link rel="stylesheet" href="common.css" />
    <style>
      body {
        width: 320px;
        padding: 0.75rem;
      }
      header {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin-bottom: 0.6rem;
      }
      footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 0.25rem;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Untrackable</h1>
      <span id="status" class="status" role="status" aria-live="polite"></span>
    </header>

    <fieldset>
      <legend>Protection</legend>
      <label><input type="checkbox" id="enabled" /> <span>Clean links automatically</span></label>
      <div class="row" role="radiogroup" aria-label="Cleaning mode">
        <label
          ><input type="radio" name="mode" value="clean" /> <span>Clean <small>(recommended)</small></span></label
        >
        <label><input type="radio" name="mode" value="strict" /> <span>Strict</span></label>
      </div>
      <div class="row">
        <button type="button" id="pause">Pause for 15 minutes</button>
      </div>
    </fieldset>

    <div id="loop-section" class="row" hidden>
      <p class="status off" style="margin: 0 0 0.4rem">
        <code id="loop-host"></code> failed with too many redirects. Tracker cleaning may be the cause.
      </p>
      <button type="button" class="primary" id="loop-retry">Reload once without cleaning</button>
    </div>

    <fieldset id="site-section">
      <legend>This site: <code id="site-host">–</code></legend>
      <label
        ><input type="checkbox" id="site-exception" />
        <span>Never clean links to this site <small>(includes subdomains)</small></span></label
      >
      <p id="site-note" class="muted" style="margin: 0"></p>
      <label
        ><input type="checkbox" id="tab-paused" />
        <span>Pause in this tab <small>(until you turn it back on or close the tab)</small></span></label
      >
    </fieldset>

    <div class="row">
      <button type="button" class="primary" id="copy">Copy clean link</button>
      <span id="copy-result" class="muted" role="status" aria-live="polite"></span>
    </div>

    <footer>
      <span class="muted">Processed locally. Nothing is collected.</span>
      <button type="button" id="open-options">Settings</button>
    </footer>
    <script src="popup.js"></script>
  </body>
</html>
