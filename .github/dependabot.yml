version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Types must match the Node.js major used in CI and releases (22);
      # newer majors would type-check APIs that do not exist at runtime.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # Pinned to the Chromium build preinstalled in the development
      # container (see CLAUDE.md); updated deliberately together with it.
      - dependency-name: 'playwright'
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
