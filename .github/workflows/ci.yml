name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly run so new advisories (npm audit / cargo audit) surface without a push.
    - cron: '17 4 * * 1'

# Least privilege: CI only needs to read the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Only superseded PR runs are cancelled; every commit on main gets a full run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    name: Rust engine (fmt, clippy, tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain (pinned in rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --all --locked
      - name: Build CLI example
        run: cargo build --release --example clean --locked

  web:
    name: TypeScript engine + extension (format, lint, types, unit, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Build and package extension
        run: npm run package --workspace apps/browser-extension
      - name: Check the zip is reproducible (independent of umask and file modes)
        run: |
          set -euo pipefail
          first="$(sha256sum artifacts/*.zip | cut -d' ' -f1)"
          chmod -R g+w apps/browser-extension/static
          (umask 002 && npm run package --workspace apps/browser-extension)
          chmod -R g-w apps/browser-extension/static
          second="$(sha256sum artifacts/*.zip | cut -d' ' -f1)"
          echo "first=$first second=$second"
          test "$first" = "$second"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: untrackable-chromium
          path: artifacts/*.zip
          if-no-files-found: error
          retention-days: 14

  e2e:
    name: Browser end-to-end (Chromium)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium for Playwright
        # The runner image already ships Chromium's shared libraries; --with-deps
        # only adds optional fonts. If the Ubuntu mirrors are unreachable (seen
        # 2026-11-11: 'Temporary failure resolving azure.archive.ubuntu.com'),
        # install the browser alone instead of failing before any test runs.
        # A missing library would still fail the e2e step below.
        run: |
          npx playwright install --with-deps chromium || {
            echo "::warning::system dependencies could not be installed; installing Chromium only"
            npx playwright install chromium
          }
      - run: npm run test:e2e

  compat:
    # The full end-to-end suite against Chrome for Testing: the minimum version
    # declared in manifest.json (116) and a recent stable release. Branded
    # Google Chrome no longer loads extensions from the command line, Chrome
    # for Testing does. Archives are pinned by version and SHA-256.
    # The job name carries only the major version: it is a required status
    # check in the main-branch ruleset, so a patch update of the pinned build
    # must not rename it. (A new major version needs the ruleset updated too.)
    name: Browser compatibility (Chrome ${{ matrix.chrome.major }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        chrome:
          - major: 116
            version: 116.0.5845.96
            sha256: 5d8ab1f999071b213d85e46ea4505d99df818b6fd0f8449e79710cb5403ba858
          - major: 157
            version: 157.0.8103.50
            sha256: d17167bc092eb495a3b768c7467f27e35f625aa03834233a1663af67dcb668c9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install system dependencies (fonts are optional)
        run: npx playwright install-deps chromium || echo "::warning::system dependencies could not be installed"
      - name: Download Chrome for Testing ${{ matrix.chrome.version }}
        env:
          VERSION: ${{ matrix.chrome.version }}
          SHA256: ${{ matrix.chrome.sha256 }}
        run: |
          set -euo pipefail
          curl -fsSL --retry 4 --retry-delay 5 -o chrome.zip \
            "https://storage.googleapis.com/chrome-for-testing-public/${VERSION}/linux64/chrome-linux64.zip"
          echo "${SHA256}  chrome.zip" | sha256sum -c -
          unzip -q chrome.zip -d "$RUNNER_TEMP/cft"
          echo "CHROMIUM_PATH=$RUNNER_TEMP/cft/chrome-linux64/chrome" >> "$GITHUB_ENV"
      - run: npm run test:e2e

  conformance:
    name: TS vs Rust engine conformance (differential)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install Rust toolchain (pinned in rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: npm ci
      # Corpus is generated from rules/rules.json, so new rules are covered automatically.
      - run: npm run test:conformance -- --cases 50000

  audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # The shipped extension has no third-party runtime dependencies; this
      # fails on high/critical advisories in the build and test toolchain.
      - name: npm audit
        run: npm audit --audit-level=high
      - name: cargo audit
        run: |
          rustup toolchain install
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit
